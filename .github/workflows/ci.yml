name: CI/CD Pipeline

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'installer/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: WaDesk-Windows-x86_64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: WaDesk-Linux-x86_64

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: WaDesk-macOS-Universal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Dynamic Version
        id: ver
        shell: bash
        run: |
          git fetch --tags --force
          VERSION=$(python3 .github/scripts/generate_version.py)
          CLEAN_VER="${VERSION#v}"
          echo "RESOLVED_TAG=$VERSION" >> $GITHUB_ENV
          echo "RESOLVED_VER=$CLEAN_VER" >> $GITHUB_ENV
          python3 .github/scripts/generate_version.py --sync-versions "$CLEAN_VER"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run Unit & Integration Tests
        run: cargo test --verbose

      - name: Build Optimized Release Binary
        run: cargo build --release --verbose

      # ----------------- WINDOWS PACKAGING -----------------
      - name: Package Windows Installer & Portable Zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir win-artifacts
          
          # 1. Compile Inno Setup GUI Installer
          choco install innosetup --no-progress -y
          $iscc = if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
            "iscc"
          }
          & $iscc installer\windows\wadesk.iss
          
          # 2. Package Portable Zip
          mkdir dist
          cp target/release/wadesk.exe dist/
          cp assets/icon.ico dist/
          cp README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "win-artifacts/WaDesk-${{ env.RESOLVED_VER }}-Windows-x86_64.zip"

      - name: Upload Windows Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: win-artifacts/*
          if-no-files-found: error

      # ----------------- LINUX PACKAGING -----------------
      - name: Package Linux Debian (.deb) & Tarball Installer
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir linux-artifacts
          
          # 1. Build .deb installer package with dynamic version
          mkdir -p deb-package/DEBIAN
          mkdir -p deb-package/usr/bin
          mkdir -p deb-package/usr/share/applications
          mkdir -p deb-package/usr/share/icons/hicolor/scalable/apps
          
          echo "Package: wadesk" > deb-package/DEBIAN/control
          echo "Version: ${{ env.RESOLVED_VER }}" >> deb-package/DEBIAN/control
          echo "Section: net" >> deb-package/DEBIAN/control
          echo "Priority: optional" >> deb-package/DEBIAN/control
          echo "Architecture: amd64" >> deb-package/DEBIAN/control
          echo "Maintainer: WaDesk Team <support@wadesk.io>" >> deb-package/DEBIAN/control
          echo "Description: Lightweight Native WhatsApp Desktop Client" >> deb-package/DEBIAN/control
          echo " WaDesk is a fast, lightweight native WhatsApp Web client and background engine." >> deb-package/DEBIAN/control
          
          cp target/release/wadesk deb-package/usr/bin/wadesk
          chmod +x deb-package/usr/bin/wadesk
          cp installer/linux/wadesk.desktop deb-package/usr/share/applications/wadesk.desktop
          cp assets/whatsapp.svg deb-package/usr/share/icons/hicolor/scalable/apps/wadesk.svg
          
          dpkg-deb --build deb-package "linux-artifacts/wadesk_${{ env.RESOLVED_VER }}_amd64.deb"
          
          # 2. Build tarball with install.sh / uninstall.sh
          mkdir dist
          cp target/release/wadesk dist/
          cp installer/linux/wadesk.desktop dist/
          cp installer/linux/install.sh dist/
          cp installer/linux/uninstall.sh dist/
          chmod +x dist/install.sh dist/uninstall.sh
          cp assets/whatsapp.svg dist/wadesk.svg
          cp README.md dist/
          tar -czvf "linux-artifacts/WaDesk-${{ env.RESOLVED_VER }}-Linux-x86_64.tar.gz" -C dist .

      - name: Upload Linux Artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: linux-artifacts/*
          if-no-files-found: error

      # ----------------- MACOS PACKAGING -----------------
      - name: Package macOS App Bundle, DMG & ZIP
        if: matrix.os == 'macos-latest'
        run: |
          mkdir mac-artifacts
          
          # 1. Add Apple Silicon target and cross-compile both architectures
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          
          # 2. Build WaDesk.app bundle with Universal 2 (Fat) binary
          mkdir -p WaDesk.app/Contents/MacOS
          mkdir -p WaDesk.app/Contents/Resources
          
          lipo -create -output WaDesk.app/Contents/MacOS/wadesk \
            target/aarch64-apple-darwin/release/wadesk \
            target/x86_64-apple-darwin/release/wadesk
          chmod +x WaDesk.app/Contents/MacOS/wadesk
          
          echo "Verified Universal Binary architecture slices:"
          lipo -info WaDesk.app/Contents/MacOS/wadesk
          
          cp installer/macos/Info.plist WaDesk.app/Contents/Info.plist
          
          # Generate native AppIcon.icns
          mkdir icon.iconset
          sips -z 16 16     assets/whatsapp.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/whatsapp.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/whatsapp.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/whatsapp.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/whatsapp.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/whatsapp.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/whatsapp.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/whatsapp.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/whatsapp.png --out icon.iconset/icon_512x512.png
          iconutil -c icns icon.iconset -o WaDesk.app/Contents/Resources/AppIcon.icns
          
          # 3. Build Universal DMG (Apple Disk Image Installer for M1-M4 & Intel)
          mkdir -p dmg-root
          cp -r WaDesk.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "WaDesk" -srcfolder dmg-root -ov -format UDZO "mac-artifacts/WaDesk-${{ env.RESOLVED_VER }}-macOS-Universal.dmg"
          
          # 4. Zip Universal WaDesk.app
          zip -r "mac-artifacts/WaDesk-${{ env.RESOLVED_VER }}-macOS-Universal.zip" WaDesk.app

      - name: Upload macOS Artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: mac-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-and-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Semantic Version and Auto-Tag
        id: vars
        run: |
          git fetch --tags --force
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME=$(python3 .github/scripts/generate_version.py)
            echo "Auto-creating git tag: $TAG_NAME"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME" || true
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums (SHA256)
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          echo "Generated SHA256 Checksums:"
          cat SHA256SUMS.txt

      - name: Prepare Rich Release Notes
        run: |
          python3 .github/scripts/generate_version.py --render-notes release_body.md --version "${{ env.TAG_NAME }}"
          echo "=== Release Notes Preview ==="
          cat release_body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "WaDesk ${{ env.TAG_NAME }}"
          body_path: release_body.md
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Updated Version to Repository
        run: |
          CLEAN_VER="${{ env.TAG_NAME }}"
          CLEAN_VER="${CLEAN_VER#v}"
          python3 .github/scripts/generate_version.py --sync-versions "$CLEAN_VER"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml installer/windows/wadesk.iss installer/macos/Info.plist
          if git diff --staged --quiet; then
            echo "Version files are already up-to-date."
          else
            git commit -m "chore(release): bump version to $CLEAN_VER in Cargo.toml and installers [skip ci]"
            git push origin HEAD:master || git push origin HEAD:main || true
          fi

      - name: Cleanup Workspace & Release Artifacts on VPS
        if: always()
        run: |
          echo "Cleaning up build artifacts and temporary files from Coolify VPS..."
          rm -rf release-artifacts release_body.md SHA256SUMS.txt
          # Clean working directory completely to keep VPS disk 100% lean
          git clean -ffdx -e .env -e .git || true
          echo "Coolify VPS workspace cleaned successfully."
