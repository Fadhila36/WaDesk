name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: WaDesk-Windows-x86_64
            bin_name: wadesk.exe
            archive_ext: zip

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: WaDesk-Linux-x86_64
            bin_name: wadesk
            archive_ext: tar.gz

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: WaDesk-macOS-x86_64
            bin_name: wadesk
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run Unit & Integration Tests
        run: cargo test --verbose

      - name: Build Optimized Release Binary
        run: cargo build --release --verbose

      - name: Package Windows Artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir dist
          cp target/release/wadesk.exe dist/
          cp assets/icon.ico dist/
          cp README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Package Linux Artifact
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir dist
          cp target/release/wadesk dist/
          cp README.md dist/
          tar -czvf "${{ matrix.artifact_name }}.tar.gz" -C dist .

      - name: Package macOS Artifact
        if: matrix.os == 'macos-latest'
        run: |
          mkdir dist
          cp target/release/wadesk dist/
          cp README.md dist/
          zip -j "${{ matrix.artifact_name }}.zip" dist/*

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-and-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version and Auto-Tag
        id: vars
        run: |
          git fetch --tags --force
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            VERSION=$(grep '^version' Cargo.toml | head -n1 | cut -d '"' -f2)
            BASE_TAG="v${VERSION}"
            if git rev-parse "$BASE_TAG" >/dev/null 2>&1; then
              TAG_NAME="${BASE_TAG}-build.${{ github.run_number }}"
            else
              TAG_NAME="${BASE_TAG}"
            fi
            echo "Auto-creating git tag: $TAG_NAME"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME" || true
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums (SHA256)
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          echo "Generated SHA256 Checksums:"
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "WaDesk ${{ env.TAG_NAME }}"
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
