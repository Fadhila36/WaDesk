<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="wadeskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2fe675" />
      <stop offset="45%" stop-color="#1faa63" />
      <stop offset="100%" stop-color="#0f7a55" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0a4632" flood-opacity="0.35" />
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base with Gradient -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#wadeskGradient)" filter="url(#softShadow)" />

  <!-- Subtle Gloss Overlay -->
  <path d="M 24 132 C 24 64 64 24 132 24 L 380 24 C 448 24 488 64 488 132 C 340 180 180 170 24 132 Z" fill="#ffffff" opacity="0.12" />

  <!-- Chat Bubble Outline -->
  <g filter="url(#innerGlow)">
    <path d="M 148 160 C 148 138 166 120 188 120 L 324 120 C 346 120 364 138 364 160 L 364 292 C 364 314 346 332 324 332 L 292 332 L 268 368 C 264 374 254 374 250 368 L 232 332 L 188 332 C 166 332 148 314 148 292 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Stylized 'W' Wave Monogram -->
    <path d="M 108 248 C 144 248 152 208 184 212 C 204 214 218 280 238 280 C 256 280 270 220 286 220 C 304 220 318 276 336 276 C 354 276 366 198 392 200" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>